<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Elegant QR code scanner. Scan with camera or upload images. Detect links, text, contacts and more.">
    <title>QR Scanner Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Ambient background orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header" id="appHeader">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                    <rect x="2" y="2" width="14" height="14" rx="3" stroke="url(#g1)" stroke-width="2.5" fill="none"/>
                    <rect x="24" y="2" width="14" height="14" rx="3" stroke="url(#g1)" stroke-width="2.5" fill="none"/>
                    <rect x="2" y="24" width="14" height="14" rx="3" stroke="url(#g1)" stroke-width="2.5" fill="none"/>
                    <rect x="6" y="6" width="6" height="6" rx="1.5" fill="url(#g1)"/>
                    <rect x="28" y="6" width="6" height="6" rx="1.5" fill="url(#g1)"/>
                    <rect x="6" y="28" width="6" height="6" rx="1.5" fill="url(#g1)"/>
                    <rect x="26" y="26" width="4" height="4" rx="1" fill="url(#g1)"/>
                    <rect x="32" y="26" width="6" height="4" rx="1" fill="url(#g1)"/>
                    <rect x="26" y="32" width="4" height="6" rx="1" fill="url(#g1)"/>
                    <rect x="34" y="34" width="4" height="4" rx="1" fill="url(#g1)"/>
                    <defs>
                        <linearGradient id="g1" x1="0" y1="0" x2="40" y2="40">
                            <stop stop-color="#00d4ff"/>
                            <stop offset="1" stop-color="#7c3aed"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1>QR Scanner</h1>
            <p class="subtitle">Scan &amp; decode instantly</p>
        </header>

        <!-- ===== HOME VIEW ===== -->
        <main id="homeView" class="view active">
            <div class="glass-card options-card">
                <button id="btnScanCamera" class="option-btn" type="button">
                    <div class="option-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                            <circle cx="12" cy="13" r="4"/>
                        </svg>
                    </div>
                    <div class="option-text">
                        <span class="option-title">Scan with Camera</span>
                        <span class="option-desc">Point your camera at any QR code</span>
                    </div>
                    <svg class="option-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
                </button>

                <div class="divider"></div>

                <button id="btnUpload" class="option-btn" type="button">
                    <div class="option-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <div class="option-text">
                        <span class="option-title">Upload Image</span>
                        <span class="option-desc">Pick a QR code image from your gallery</span>
                    </div>
                    <svg class="option-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </div>

            <div class="features-row">
                <div class="feature-chip"><span>⚡</span> Instant</div>
                <div class="feature-chip"><span>🔒</span> Private</div>
                <div class="feature-chip"><span>📱</span> Any Device</div>
            </div>
        </main>

        <!-- ===== SCANNER VIEW ===== -->
        <section id="scannerView" class="view">
            <div class="scanner-wrapper">
                <div class="scanner-top-bar">
                    <button id="btnBackScanner" class="icon-btn" type="button" aria-label="Go back">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    </button>
                    <span class="scanner-title">Scanning…</span>
                    <button id="btnSwitchCam" class="icon-btn" type="button" aria-label="Switch camera">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 16v4h-4"/><path d="M14 20l6-6"/>
                            <path d="M4 8V4h4"/><path d="M10 4L4 10"/>
                        </svg>
                    </button>
                </div>
                <div class="scanner-frame">
                    <div id="reader"></div>
                    <div class="scan-overlay" id="scanOverlay">
                        <div class="corner tl"></div>
                        <div class="corner tr"></div>
                        <div class="corner bl"></div>
                        <div class="corner br"></div>
                        <div class="scan-line"></div>
                    </div>
                </div>
                <p class="scan-hint">Position QR code within the frame</p>
            </div>
        </section>

        <!-- ===== UPLOAD VIEW ===== -->
        <section id="uploadView" class="view">
            <div class="glass-card upload-card">
                <div class="card-top-bar">
                    <button id="btnBackUpload" class="icon-btn" type="button" aria-label="Go back">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    </button>
                    <span class="card-title">Upload QR Image</span>
                    <span></span>
                </div>
                <div id="dropZone" class="drop-zone">
                    <div class="drop-visual">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="drop-svg">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                    </div>
                    <p class="drop-text">Drag &amp; drop image here</p>
                    <p class="drop-or">or</p>
                    <label class="choose-file-btn" for="fileInput">Browse Files</label>
                    <input type="file" id="fileInput" accept="image/*" hidden>
                </div>
                <div id="uploadPreview" class="upload-preview hidden">
                    <img id="previewImg" src="" alt="QR preview">
                    <div class="scanning-status">
                        <div class="spinner"></div>
                        <span>Analyzing image…</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- ===== RESULT VIEW ===== -->
        <section id="resultView" class="view">
            <div class="glass-card result-card">
                <div class="result-success-icon">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 6L9 17l-5-5"/>
                    </svg>
                </div>
                <span id="resultBadge" class="result-badge">LINK</span>
                <h2 class="result-heading">QR Code Detected</h2>
                <div id="resultContent" class="result-content"></div>
                <div class="result-actions">
                    <button id="btnOpenLink" class="action-btn primary hidden" type="button">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                        Open Link
                    </button>
                    <button id="btnCopy" class="action-btn secondary" type="button">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        Copy
                    </button>
                </div>
                <button id="btnScanAgain" class="scan-again-btn" type="button">Scan Again</button>
            </div>
        </section>

        <!-- ===== ERROR VIEW ===== -->
        <section id="errorView" class="view">
            <div class="glass-card error-card">
                <div class="result-error-icon">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round">
                        <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
                    </svg>
                </div>
                <h2 class="error-heading">Oops!</h2>
                <p id="errorMsg" class="error-msg" style="white-space:pre-line"></p>
                <div class="error-actions">
                    <button id="btnUploadFallback" class="action-btn primary" type="button" style="display:none">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        Upload Instead
                    </button>
                    <button id="btnRetry" class="scan-again-btn" type="button">Try Again</button>
                </div>
            </div>
        </section>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
